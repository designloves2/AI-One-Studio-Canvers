<!doctype html>
<html><head><meta charset="utf-8"><title>AI ONE Studio Canvers</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;min-height:100%;background:#14161c;color:#cfd3dc;font:15px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:9vh auto;padding:0 20px}h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 22px;color:#8b93a3}
label{display:block;margin:14px 0 4px;font-size:13px;color:#aab1bf}
input{width:100%;box-sizing:border-box;background:#0f1116;border:1px solid #2a2e38;border-radius:8px;padding:10px 12px;color:inherit;font:inherit;outline:none}input:focus{border-color:#8b7bff}
button{margin-top:16px;background:#8b7bff;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}button:disabled{opacity:.5}
#log{margin-top:18px;white-space:pre-wrap;font-size:13.5px;color:#aab1bf}#log.ok{color:#34c98e}#log.bad{color:#ff7a7a}small{color:#6f7788;display:block;margin-top:6px}
</style></head><body><main>
<h1>AI ONE Studio Canvers</h1><p class="sub" id="sub"></p>
<label id="lab"></label><input id="addr" placeholder="canvers.example.com" autofocus autocapitalize="off" autocorrect="off" spellcheck="false">
<small id="hint"></small><button id="go"></button><div id="log"></div></main>
<script>
const ko=/^ko/i.test(navigator.language);
const t=ko?{sub:'Canvers 서버(ComfyUI가 있는 PC)의 주소를 넣어 주세요.',lab:'접속 주소',hint:'예: canvers.tjtj.cloud — 로그인이 필요한 주소면 다음 창에서 로그인합니다.',go:'연결',busy:'확인하는 중…'}
:{sub:'Enter the address of the Canvers server (the PC that runs ComfyUI).',lab:'Address',hint:'e.g. canvers.example.com — if it needs a sign-in, you sign in in the next window.',go:'Connect',busy:'Checking…'};
for(const k of ['sub','lab','hint','go'])document.getElementById(k).textContent=t[k];
const $=id=>document.getElementById(id);
const post=m=>window.webkit.messageHandlers.canvers.postMessage(m);
// called by the app
window.canvers={saved:a=>{$('addr').value=a||''},result:(ok,msg)=>{$('log').className=ok?'ok':'bad';$('log').textContent=msg;$('go').disabled=ok}};
function go(){$('go').disabled=true;$('log').className='';$('log').textContent=t.busy;post({type:'connect',address:$('addr').value})}
$('go').onclick=go;$('addr').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
post({type:'load'});
</script></body></html>
